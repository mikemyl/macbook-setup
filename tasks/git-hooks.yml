---
# Global git hooks: gitleaks secret scan before every commit, in every repo. The hook
# chains to the repo's own .git/hooks/<name>, which a global core.hooksPath would hide.

- name: Create global git hooks directory
  ansible.builtin.file:
    path: "{{ git_hooks_dir }}"
    state: directory
    mode: '0755'

- name: Install global git hooks
  ansible.builtin.copy:
    src: files/git-hooks/hook
    dest: "{{ git_hooks_dir }}/{{ item }}"
    mode: '0755'
  loop: "{{ git_hook_names }}"

- name: Point git at the global hooks directory
  community.general.git_config:
    name: core.hooksPath
    scope: global
    value: "{{ git_hooks_dir }}"
