---
# Oh My Zsh installation
- name: Check if Oh My Zsh is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
  register: omz_installed

- name: Download Oh My Zsh install script
  ansible.builtin.get_url:
    url: "{{ omz_install_url }}"
    dest: /tmp/install_omz.sh
    mode: '0755'
  when: not omz_installed.stat.exists

- name: Install Oh My Zsh
  ansible.builtin.command:
    cmd: /tmp/install_omz.sh --unattended
  when: not omz_installed.stat.exists
  changed_when: true

# Oh My Zsh plugins
- name: Install Oh My Zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
  loop: "{{ omz_plugins }}"

# Dotfiles from template
- name: Deploy .zshrc from template
  ansible.builtin.template:
    src: templates/zshrc.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    mode: '0644'
    backup: true

# tmux configuration
- name: Create tmux config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/tmux"
    state: directory
    mode: '0755'

- name: Deploy tmux.conf from template
  ansible.builtin.template:
    src: templates/tmux.conf.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/tmux/tmux.conf"
    mode: '0644'
    backup: true

# tmux-init script
- name: Create ~/.local/bin directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: '0755'

- name: Deploy tmux-init script
  ansible.builtin.template:
    src: templates/tmux-init.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/tmux-init"
    mode: '0755'

# Restart iTerm2 to apply. A running iTerm2 can overwrite the plist when it saves its preferences.
- name: Configure iTerm2 key mappings
  ansible.builtin.shell: |
    plist=~/Library/Preferences/com.googlecode.iterm2.plist
    key=":New Bookmarks:0:Keyboard Map:{{ item.key }}"
    action=$(/usr/libexec/PlistBuddy -c "Print '$key:Action'" "$plist" 2>/dev/null || true)
    text=$(/usr/libexec/PlistBuddy -c "Print '$key:Text'" "$plist" 2>/dev/null || true)
    [[ $action == '{{ item.action }}' && $text == '{{ item.text }}' ]] && exit 0
    /usr/libexec/PlistBuddy -c "Delete '$key'" "$plist" >/dev/null 2>&1 || true
    /usr/libexec/PlistBuddy -c "Add '$key' dict" \
      -c "Add '$key:Action' integer {{ item.action }}" \
      -c "Add '$key:Text' string '{{ item.text }}'" "$plist"
    echo changed
  args:
    executable: /bin/bash
  loop: "{{ iterm2_key_mappings }}"
  loop_control:
    label: "{{ item.name }}"
  register: iterm2_key_mapping
  changed_when: "'changed' in iterm2_key_mapping.stdout"
