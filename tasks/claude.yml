---
# Claude Code setup: verified-development plugin, bundled skills, CLAUDE.md
#
# Skills/agents that used to be vendored from citypaul/.dotfiles are now carried
# by the verified-development plugin (enabled via settings.json). See vars/main.yml.

- name: Create Claude config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ claude_dir }}"
    - "{{ claude_dir }}/skills"

# ── Bundled skills (no upstream source) ──────────────────────────────────────

- name: Copy bundled skills
  ansible.builtin.copy:
    src: "claude/skills/{{ item }}/"
    dest: "{{ claude_dir }}/skills/{{ item }}/"
    mode: '0644'
    directory_mode: '0755'
  loop:
    - accessibility
    - best-practices
    - performance

# ── CLAUDE.md ────────────────────────────────────────────────────────────────

- name: Check for local CLAUDE.md override
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/files/claude/CLAUDE.local.md"
  register: claude_local_md

- name: Deploy CLAUDE.md (local override)
  ansible.builtin.copy:
    src: claude/CLAUDE.local.md
    dest: "{{ claude_dir }}/CLAUDE.md"
    mode: '0644'
  when: claude_local_md.stat.exists

- name: Deploy CLAUDE.md (default)
  ansible.builtin.copy:
    src: claude/CLAUDE.md
    dest: "{{ claude_dir }}/CLAUDE.md"
    mode: '0644'
  when: not claude_local_md.stat.exists

# ── Settings & plugin registration ───────────────────────────────────────────

- name: Deploy Claude settings.json
  ansible.builtin.template:
    src: claude-settings.json.j2
    dest: "{{ claude_dir }}/settings.json"
    mode: '0644'

# ── MCP servers (user scope) ─────────────────────────────────────────────────
# settings.json carries no mcpServers key; user-scope servers live in
# ~/.claude.json and are managed through the CLI.

- name: Check which user-scope MCP servers exist
  ansible.builtin.command: "claude mcp get {{ item.name }}"
  loop: "{{ claude_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  register: claude_mcp_state
  changed_when: false
  failed_when: false

- name: Register missing user-scope MCP servers
  ansible.builtin.command: >
    claude mcp add --scope user
    --transport {{ item.item.transport }}
    {{ item.item.name }} {{ item.item.url }}
  loop: "{{ claude_mcp_state.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0

# ── Statusline ────────────────────────────────────────────────────────────────

- name: Create Claude hooks directory
  ansible.builtin.file:
    path: "{{ claude_dir }}/hooks"
    state: directory
    mode: '0755'

- name: Copy verified-development statusline to stable path
  ansible.builtin.shell:
    cmd: >
      find {{ claude_dir }}/plugins/cache/verified-development -name "statusline.js" -print -quit
      | head -1
      | xargs -I{} cp {} {{ claude_dir }}/hooks/vd-statusline.js
  args:
    creates: "{{ claude_dir }}/hooks/vd-statusline.js"
